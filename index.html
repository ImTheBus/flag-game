<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flag Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* ===== Base layout ===== */

    :root {
      --bg1: #1b1f4b;
      --bg2: #532d7f;
      --bg3: #ff6b6b;
      --bg4: #ffd93d;
      --frame-bg: #0b101a;
      --frame-border: #ffd96a;
      --accent: #ff9f43;
      --accent-strong: #ffcd1f;
      --text-main: #fefefe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      /* Party style background */
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.15) 0, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(255,255,255,0.18) 0, transparent 40%),
        radial-gradient(circle at 15% 80%, rgba(255,255,255,0.14) 0, transparent 45%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* Confetti dots */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 0, transparent 55%),
        radial-gradient(circle, rgba(255,223,89,0.9) 0, transparent 55%),
        radial-gradient(circle, rgba(255,121,121,0.9) 0, transparent 55%),
        radial-gradient(circle, rgba(129,236,236,0.9) 0, transparent 55%);
      background-size: 12px 12px, 10px 10px, 8px 8px, 14px 14px;
      background-position:
        5% 10%, 25% 80%, 60% 30%, 85% 75%;
      mix-blend-mode: screen;
      opacity: 0.45;
    }

    /* ===== Game container ===== */

    .game-shell {
      position: relative;
      width: min(100%, 960px);
      height: min(100%, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .frame-outer {
      position: relative;
      flex: 1;
      width: 100%;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame-inner {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 900px;
      border-radius: 32px;
      padding: 18px;
      background:
        linear-gradient(135deg, #f8e9c0, #ffd96a, #f4c531);
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.35),
        0 18px 45px rgba(0,0,0,0.75);
    }

    .frame-inner::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 24px;
      border: 3px double rgba(70,46,10,0.65);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.25),
        inset 0 0 24px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    .frame-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      background: radial-gradient(circle at 30% 0%, #273143, #0b101a 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    /* ===== Idle state ===== */

    .title-main {
      font-family: "Iceland", system-ui, sans-serif;
      font-size: clamp(3rem, 7vw, 4.6rem);
      letter-spacing: 0.32em;
      text-indent: 0.32em;
      text-transform: uppercase;
      color: var(--accent-strong);
      text-shadow:
        0 0 12px rgba(0,0,0,0.9),
        0 0 26px rgba(0,0,0,0.9);
      animation: pulseTitle 1.8s ease-in-out infinite;
      text-align: center;
    }

    @keyframes pulseTitle {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.7; }
    }

    .subtitle {
      margin-top: 8px;
      font-size: 0.95rem;
      opacity: 0.85;
      text-align: center;
    }

    .start-btn {
      margin-top: 22px;
      padding: 12px 28px;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      background: linear-gradient(135deg, #ff9f43, #ff6b6b);
      color: #1b0902;
      box-shadow:
        0 10px 24px rgba(0,0,0,0.7),
        0 0 0 2px rgba(255,255,255,0.12);
      cursor: pointer;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out, filter 0.12s ease-out;
    }

    .start-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 16px 32px rgba(0,0,0,0.85);
      filter: brightness(1.05);
    }

    .start-btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    }

    .start-btn:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
      box-shadow:
        0 10px 24px rgba(0,0,0,0.7),
        0 0 0 2px rgba(255,255,255,0.12);
    }

    .status-text {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* ===== Game state ===== */

    .flag-image {
      max-width: 95%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.8);
      object-fit: contain;
      background: #000;
    }

    .question-text {
      margin-top: 16px;
      font-size: 1rem;
    }

    .countdown {
      margin-top: 4px;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .answer-text {
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .hint-text {
      margin-top: 8px;
      font-size: 0.85rem;
      opacity: 0.78;
    }

    .footer-instructions {
      font-size: 0.8rem;
      opacity: 0.8;
      text-align: center;
      margin-top: 4px;
    }

    /* ===== Utility ===== */

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="frame-outer">
      <div class="frame-inner">
        <div class="frame-content" id="frame-content">
          <!-- Idle state -->
          <div id="idle-screen">
            <div class="title-main">FLAG GAME</div>
            <div class="subtitle">Guess the flag before the countdown hits zero.</div>
            <button id="start-btn" class="start-btn" disabled>Loading flags...</button>
            <div class="status-text" id="status-text"></div>
          </div>

          <!-- Game state -->
          <div id="game-screen" class="hidden">
            <img id="flag-image" class="flag-image" src="" alt="Country flag" />
            <div class="question-text">What flag is this?</div>
            <div class="countdown" id="countdown-text"></div>
            <div class="answer-text" id="answer-text"></div>
            <div class="hint-text" id="hint-text"></div>
            <div class="footer-instructions">
              Tip: press the spacebar to reveal answers and move to the next flag.
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-note">
      Flag Game • Drop-in fun for geography nerds.
    </div>
  </div>

  <script>
    // File: inline script in /index.html  •  Date: 2025-12-02  •  Version: v1.0

    const API_URL = "https://restcountries.com/v3.1/all?fields=name,flags,capital";

    const startBtn = document.getElementById("start-btn");
    const statusText = document.getElementById("status-text");
    const idleScreen = document.getElementById("idle-screen");
    const gameScreen = document.getElementById("game-screen");

    const flagImg = document.getElementById("flag-image");
    const countdownText = document.getElementById("countdown-text");
    const answerText = document.getElementById("answer-text");
    const hintText = document.getElementById("hint-text");

    let countries = [];
    let currentCountry = null;
    let countdownTimer = null;
    let timeLeft = 0;

    // answerStep: 0 = nothing revealed, 1 = country shown, 2 = capital shown
    let answerStep = 0;
    let gameActive = false;

    // Fetch all countries and flags once
    async function loadCountries() {
      try {
        statusText.textContent = "Contacting the flag vault...";
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("HTTP error " + response.status);
        const data = await response.json();

        countries = data
          .filter(c => c.flags && (c.flags.svg || c.flags.png) && c.name && c.name.common)
          .map(c => ({
            name: c.name.common,
            flagUrl: c.flags.svg || c.flags.png,
            capital: Array.isArray(c.capital) && c.capital.length ? c.capital[0] : "Unknown"
          }));

        if (!countries.length) throw new Error("No countries returned");

        startBtn.disabled = false;
        startBtn.textContent = "Start game now";
        statusText.textContent = "Press the button to begin, then use spacebar for answers.";
      } catch (err) {
        console.error(err);
        startBtn.disabled = true;
        startBtn.textContent = "Error loading flags";
        statusText.textContent = "Could not load flags. Check your connection and refresh.";
      }
    }

    function pickRandomCountry() {
      const index = Math.floor(Math.random() * countries.length);
      return countries[index];
    }

    function showIdle() {
      gameActive = false;
      idleScreen.classList.remove("hidden");
      gameScreen.classList.add("hidden");
    }

    function showGameScreen() {
      idleScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
    }

    function startRound() {
      if (!countries.length) return;

      // Clear previous timer
      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      currentCountry = pickRandomCountry();
      answerStep = 0;
      gameActive = true;

      flagImg.src = currentCountry.flagUrl;
      flagImg.alt = "Flag of " + currentCountry.name;

      answerText.textContent = "";
      hintText.textContent = "";
      timeLeft = 10;
      countdownText.textContent = "Time left: " + timeLeft + " seconds";

      countdownTimer = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          countdownText.textContent = "Time left: 0 seconds";
          hintText.textContent = "Time is up. Hit spacebar for the answer.";
          clearInterval(countdownTimer);
          countdownTimer = null;
        } else {
          countdownText.textContent = "Time left: " + timeLeft + " seconds";
        }
      }, 1000);

      hintText.textContent = "Try to guess before the countdown finishes.";
    }

    function handleSpacePress() {
      if (!gameActive || !currentCountry) return;

      if (answerStep === 0) {
        // Reveal country
        answerText.textContent = "Country: " + currentCountry.name;
        hintText.textContent = "Press space again to reveal the capital.";
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
        answerStep = 1;
      } else if (answerStep === 1) {
        // Reveal capital
        answerText.textContent =
          "Country: " + currentCountry.name + " • Capital: " + currentCountry.capital;
        hintText.textContent = "Press space once more for a new flag.";
        answerStep = 2;
      } else {
        // Next round
        startRound();
      }
    }

    // Event wiring

    startBtn.addEventListener("click", () => {
      showGameScreen();
      startRound();
    });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.key === " ") {
        event.preventDefault();
        handleSpacePress();
      }
    });

    // Kick off data load
    loadCountries();
  </script>
</body>
</html>
