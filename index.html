<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flag Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* ===== Base layout ===== */

    :root {
      --bg1: #1b1f4b;
      --bg2: #532d7f;
      --frame-bg: #0b101a;
      --accent: #ffcd1f;
      --accent-strong: #ff9f43;
      --text-main: #fefefe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.15) 0, transparent 40%),
        radial-gradient(circle at 90% 10%, rgba(255,255,255,0.18) 0, transparent 40%),
        radial-gradient(circle at 15% 80%, rgba(255,255,255,0.14) 0, transparent 45%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    /* Confetti overlay */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.8) 0, transparent 55%),
        radial-gradient(circle, rgba(255,223,89,0.9) 0, transparent 55%),
        radial-gradient(circle, rgba(255,121,121,0.9) 0, transparent 55%),
        radial-gradient(circle, rgba(129,236,236,0.9) 0, transparent 55%);
      background-size: 12px 12px, 10px 10px, 8px 8px, 14px 14px;
      background-position:
        5% 10%, 25% 80%, 60% 30%, 85% 75%;
      mix-blend-mode: screen;
      opacity: 0.4;
    }

    /* ===== Game container ===== */

    .game-shell {
      position: relative;
      width: min(100%, 1100px);
      height: min(100%, 700px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .frame-outer {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .frame-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 34px;
      padding: 18px;
      background: linear-gradient(135deg, #f8e9c0, #ffd96a, #f4c531);
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.35),
        0 24px 55px rgba(0,0,0,0.9);
    }

    .frame-inner::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 26px;
      border: 3px double rgba(70,46,10,0.65);
      box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.25),
        inset 0 0 24px rgba(0,0,0,0.55);
      pointer-events: none;
    }

    .frame-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: radial-gradient(circle at 30% 0%, #273143, var(--frame-bg) 65%);
      padding: 18px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto auto;
      row-gap: 8px;
      align-items: center;
      justify-items: center;
      overflow: hidden;
    }

    /* ===== Idle state ===== */

    .title-main {
      font-family: "Iceland", system-ui, sans-serif;
      font-size: clamp(3.2rem, 7.5vw, 5rem);
      letter-spacing: 0.35em;
      text-indent: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow:
        0 0 12px rgba(0,0,0,0.9),
        0 0 26px rgba(0,0,0,0.9);
      animation: pulseTitle 1.8s ease-in-out infinite;
      text-align: center;
      grid-row: 1 / 2;
    }

    @keyframes pulseTitle {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.07); opacity: 1; }
      100% { transform: scale(1); opacity: 0.7; }
    }

    .start-btn {
      margin-top: 10px;
      padding: 12px 30px;
      border-radius: 999px;
      border: none;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
      background: linear-gradient(135deg, #ff9f43, #ff6b6b);
      color: #1b0902;
      box-shadow:
        0 10px 24px rgba(0,0,0,0.8),
        0 0 0 2px rgba(255,255,255,0.12);
      cursor: pointer;
      transition: transform 0.12s ease-out, box-shadow 0.12s ease-out, filter 0.12s ease-out;
      grid-row: 2 / 3;
    }

    .start-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 18px 32px rgba(0,0,0,0.9);
      filter: brightness(1.05);
    }

    .start-btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 8px 20px rgba(0,0,0,0.75);
    }

    .start-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .status-text {
      font-size: 0.9rem;
      opacity: 0.8;
      grid-row: 3 / 4;
      text-align: center;
    }

    /* ===== Game state ===== */

    #game-screen {
      width: 100%;
      height: 100%;
      display: contents; /* let children flow into grid rows */
    }

    .flag-image {
      max-width: 100%;
      max-height: 100%;
      grid-row: 1 / 2;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.9);
      object-fit: contain;
      background: #000;
    }

    .question-text {
      grid-row: 2 / 3;
      font-size: 1rem;
    }

    .countdown {
      grid-row: 3 / 4;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .answer-text {
      grid-row: 4 / 5;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-align: center;
      min-height: 1.4em;
    }

    .hint-text {
      grid-row: 4 / 5;
      font-size: 0.85rem;
      opacity: 0.78;
      margin-top: 1.9em;
      text-align: center;
    }

    .footer-note {
      font-size: 0.8rem;
      opacity: 0.8;
      text-align: center;
    }

    .footer-note a {
      color: var(--accent-strong);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    /* ===== Utility ===== */

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="frame-outer">
      <div class="frame-inner">
        <div class="frame-content" id="frame-content">
          <!-- Idle screen -->
          <div id="idle-screen">
            <div class="title-main">FLAG GAME</div>
            <button id="start-btn" class="start-btn" disabled>Start</button>
            <div class="status-text" id="status-text"></div>
          </div>

          <!-- Game screen -->
          <div id="game-screen" class="hidden">
            <img id="flag-image" class="flag-image" src="" alt="Flag" />
            <div class="question-text">What flag?</div>
            <div class="countdown" id="countdown-text"></div>
            <div class="answer-text" id="answer-text"></div>
            <div class="hint-text" id="hint-text"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-note">
      Flag Game • <a href="https://rougvie.com" target="_blank" rel="noopener noreferrer">rougvie.com</a>
    </div>
  </div>

  <script>
    // File: inline script in /flag-game/index.html  •  Date: 2025-12-03  •  Version: v1.1

    const API_URL = "https://restcountries.com/v3.1/all?fields=name,flags,capital";

    const startBtn = document.getElementById("start-btn");
    const statusText = document.getElementById("status-text");
    const idleScreen = document.getElementById("idle-screen");
    const gameScreen = document.getElementById("game-screen");

    const flagImg = document.getElementById("flag-image");
    const countdownText = document.getElementById("countdown-text");
    const answerText = document.getElementById("answer-text");
    const hintText = document.getElementById("hint-text");

    let countries = [];
    let currentCountry = null;
    let countdownTimer = null;
    let timeLeft = 0;
    let answerStep = 0; // 0 = none, 1 = country, 2 = capital
    let gameActive = false;

    async function loadCountries() {
      try {
        statusText.textContent = "Loading flags...";
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();

        countries = data
          .filter(c => c.flags && (c.flags.svg || c.flags.png) && c.name && c.name.common)
          .map(c => ({
            name: c.name.common,
            flagUrl: c.flags.svg || c.flags.png,
            capital: Array.isArray(c.capital) && c.capital.length ? c.capital[0] : "Unknown"
          }));

        if (!countries.length) throw new Error("No countries");

        startBtn.disabled = false;
        statusText.textContent = "";
      } catch (err) {
        console.error(err);
        startBtn.disabled = true;
        startBtn.textContent = "Error";
        statusText.textContent = "Refresh to try again.";
      }
    }

    function pickRandomCountry() {
      const index = Math.floor(Math.random() * countries.length);
      return countries[index];
    }

    function showIdle() {
      gameActive = false;
      idleScreen.classList.remove("hidden");
      gameScreen.classList.add("hidden");
    }

    function showGameScreen() {
      idleScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
    }

    function startRound() {
      if (!countries.length) return;

      if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
      }

      currentCountry = pickRandomCountry();
      answerStep = 0;
      gameActive = true;

      flagImg.src = currentCountry.flagUrl;
      flagImg.alt = "Flag of " + currentCountry.name;

      answerText.textContent = "";
      hintText.textContent = "Space: country.";
      timeLeft = 10;
      countdownText.textContent = "Time: " + timeLeft;

      countdownTimer = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          countdownText.textContent = "Time: 0";
          hintText.textContent = "Space: country.";
          clearInterval(countdownTimer);
          countdownTimer = null;
        } else {
          countdownText.textContent = "Time: " + timeLeft;
        }
      }, 1000);
    }

    function handleSpacePress() {
      if (!gameActive || !currentCountry) return;

      if (answerStep === 0) {
        answerText.textContent = "Country: " + currentCountry.name;
        hintText.textContent = "Space: capital.";
        if (countdownTimer) {
          clearInterval(countdownTimer);
          countdownTimer = null;
        }
        answerStep = 1;
      } else if (answerStep === 1) {
        answerText.textContent =
          "Country: " + currentCountry.name + " • Capital: " + currentCountry.capital;
        hintText.textContent = "Space: next flag.";
        answerStep = 2;
      } else {
        startRound();
      }
    }

    // Events

    startBtn.addEventListener("click", () => {
      showGameScreen();
      startRound();
    });

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" || event.key === " ") {
        event.preventDefault();
        handleSpacePress();
      }
    });

    // Init

    loadCountries();
  </script>
</body>
</html>
